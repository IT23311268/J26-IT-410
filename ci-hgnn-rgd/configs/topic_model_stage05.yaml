# Additive Stage 05 settings; configs/topic_model.yaml is the frozen Stage 01 section.
schema_version: "1.0"
includes: [investigation_detection.yaml]
dataset:
  # Bounded real arXiv run; the original SciCite Stage 03 root is preserved.
  stage03_root: data/processed/stage03-topics
  max_records: 2000
  allow_title_only: true
embedding:
  backend: specter2
  # Low-memory CPU profile verified on this host; quantization and truncation
  # are recorded in every encoder/cache identity.
  batch_size: 1
  max_length: 256
  normalize: true
  cache_enabled: true
  device: cpu
  precision: fp32
  quantization: int8_dynamic
  cpu_threads: 2
  min_available_ram_gib: 0.5
topic_model:
  algorithm: bertopic
  min_topic_size: 20
  top_n_words: 10
  n_topics: 8
  umap_dimensions: 5
  umap_neighbors: 15
  hdbscan_min_samples: 5
  stability_seeds: [42, 73]
temporal:
  # The local arXiv run declares EXPLORATORY_NO_TEMPORAL_CLAIM because its
  # snapshot has no verified historical availability evidence.
  inherit_stage03_policy: true
  freeze_historical_topic_models: true
seed: 42
offline: true
